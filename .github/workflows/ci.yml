name: CI - Java & SQL Enterprise Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Verify Suite (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Test Suite
        run: mvn -B clean verify

      - name: Verify Documentation & SQL Assets Presence
        run: |
          test -d sql
          test -d docs
          echo "All SQL curriculum modules and documentation verified successfully."
